{% extends "base.html" %}

{% block content %}

<style>
    .horizontal-filter {
        display: flex;
        gap: 15px; 
        align-items: center; 
        margin-bottom: 30px;
    }
    
    .horizontal-filter > div {
        flex: 1;
    }

    .horizontal-filter select,
    .horizontal-filter button {
        width: 100%;
        height: 42px; 
        border-radius: 8px; 
        border: 1px solid #ccc;
        padding: 0 10px;
        font-family: inherit;
    }

    .horizontal-filter button {
        background-color: #7b52ff; 
        color: white;
        font-weight: bold;
        border: none;
        cursor: pointer;
    }
    
    .horizontal-filter button:hover {
        opacity: 0.9;
    }
</style>

<form method="GET" action="{% url 'books' %}" class="horizontal-filter">
    
    <div>
        <select name="category">
            <option value="">-- Tất cả thể loại --</option>
            <!-- 👉 Dùng vòng lặp lấy toàn bộ thể loại từ database -->
            {% for cat in categories %}
                <option value="{{ cat.code }}" {% if category == cat.code %}selected{% endif %}>
                    {{ cat.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <select name="available">
            <option value="">-- Tất cả trạng thái --</option>
            <option value="true" {% if available == 'true' %}selected{% endif %}>Còn sách</option>
            <option value="false" {% if available == 'false' %}selected{% endif %}>Hết sách</option>
        </select>
    </div>

    <div>
        <select name="sort">
            <option value="">-- Sắp xếp theo --</option>
            <option value="title" {% if sort == 'title' %}selected{% endif %}>Tên sách (A-Z)</option>
            <option value="-title" {% if sort == '-title' %}selected{% endif %}>Tên sách (Z-A)</option>
            <option value="year" {% if sort == 'year' %}selected{% endif %}>Năm xuất bản (Cũ nhất)</option>
            <option value="-year" {% if sort == '-year' %}selected{% endif %}>Năm xuất bản (Mới nhất)</option>
        </select>
    </div>

    <div>
        <button type="submit">Lọc sách</button>
    </div>

</form>

<div class="books-grid">

    {% for book in books %}
    <div class="book-card">

        <a href="{% url 'book_detail' book.id %}" style="text-decoration: none; color: inherit; display: block;">
            <img class="book-card-image" 
                src="{% if book.image %}{{ book.image.url }}{% else %}https://via.placeholder.com/200x300{% endif %}" 
                alt="{{ book.title }}">
            
            <div class="book-card-content">
                <h3 class="book-card-title">{{ book.title }}</h3>
                <p class="book-card-author">{{ book.author }}</p>
            </div>
        </a>

        <div class="book-card-footer">

            {% if book.available > 0 %}
                <span class="book-status status-available">Còn sách</span>
            {% else %}
                <span class="book-status status-borrowed">Hết sách</span>
            {% endif %}

            <div class="book-actions">
                <form method="POST" action="{% url 'book_favorite' book.id %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" 
                            class="btn-heart {% if book.id in favorite_book_ids or book.is_favorite %}liked{% endif %}" 
                            title="Yêu thích">
                        ❤️
                    </button>
                </form>
            </div>

        </div>

    </div>
    {% endfor %}

</div>
{% endblock %}
