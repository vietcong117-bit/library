{% extends 'base.html' %}

{% block content %}
<style>
    .favorites-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        font-family: 'Inter', system-ui, sans-serif;
    }

    .favorites-container h2 {
        font-size: 28px;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 24px;
    }

  
    .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 24px;
    }

    
    .book-card {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: 100%;
        border: 1px solid #f0f0f0;
        position: relative;
    }

    .book-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.12);
    }

  
    .book-link-wrapper {
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    
    .borrowed-item-img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-bottom: 1px solid #f0f0f0;
    }

    
    .book-card-content {
        padding: 16px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .book-card-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .book-card-author {
        font-size: 0.9rem;
        color: #7f8c8d;
        margin: 0 0 16px 0;
    }

   
    .book-card-footer {
        padding-top: 8px;
        border-top: 1px solid #f1f5f9;
        margin-top: auto;
    }

    .favorite-btn {
        background-color: #ffeeec;
        color: #e02424;
        border: 1px solid #f8d7da;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.85rem;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
    }

    .favorite-btn:hover {
        background-color: #e02424;
        color: white;
        border-color: #e02424;
    }

    
    .empty-text {
        color: #94a3b8;
        font-size: 1rem;
        font-style: italic;
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px 0;
    }
</style>

<div class="favorites-container">
    <h2>Sách yêu thích</h2>

    <div class="favorites">
        <div class="books-grid">
            {% for f in favs %}
                <div class="book-card">
                 
                    <a href="{% url 'book_detail' f.book.id %}" class="book-link-wrapper">
                        <img class="borrowed-item-img" 
                             src="{% if f.book.image %}{{ f.book.image.url }}{% else %}https://via.placeholder.com/200x260{% endif %}" 
                             alt="{{ f.book.title }}">            
                        
                        <div class="book-card-content">
                            <div>
                                <h3 class="book-card-title">{{ f.book.title }}</h3>
                                <p class="book-card-author">{{ f.book.author }}</p>
                            </div>
                    </a>
                            
                            <div class="book-card-footer">
                                <form method="post" action="{% url 'book_favorite' f.book.id %}" class="favorite-form" data-book-id="{{ f.book.id }}">
                                    {% csrf_token %}
                                    <button type="submit" class="favorite-btn">❤️ Bỏ thích</button>
                                </form>
                            </div>
                        </div>
                </div>
            {% empty %}
                <p class="empty-text">Bạn chưa có sách yêu thích nào.</p>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
